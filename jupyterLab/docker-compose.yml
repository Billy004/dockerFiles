version: "3.9"

services:
  jupyterlab:
    image: jupyter/scipy-notebook:latest
    container_name: jupyterlab
    ports:
      - "8888:8888"
    volumes:
      - ./work:/home/jovyan/work
    environment:
      - JUPYTER_TOKEN=mysecret
    command: >
      sh -c "pip install earthengine-api leafmap ipywidgets ipyvuetify jupyterlab_widgets && start.sh jupyter lab"
